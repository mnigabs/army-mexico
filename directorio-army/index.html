@media (prefers-color-scheme: dark){

*{box-sizing:border-box}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.17em;flex:none}
nav a .ic{margin-right:7px}
section h2{display:flex;align-items:center;gap:10px}
section h2 .ic{color:var(--main);width:1.2em;height:1.2em}
#up .ic{width:24px;height:24px;vertical-align:middle}
footer .ic{color:var(--main)}
.tipo{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink);font-weight:700}
.tipo .ic{width:1em;height:1em}
.thumb{display:block;width:100%;max-height:440px;object-fit:contain;margin-top:12px;border-radius:8px;background:var(--chip)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.acts .btn{margin-top:0}
.btn.alt{background:transparent;color:var(--main);border:2px solid var(--main)}
.btn.alt:hover,.btn.alt:focus-visible{background:var(--chip);color:var(--ink)}
.btn .ic{margin-right:8px}
@media(min-width:600px){.acts{flex-direction:row;flex-wrap:wrap}}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(160deg,#2E0B52 0%,#6A0DAD 100%);color:#fff;
  padding:calc(34px + env(safe-area-inset-top,0px)) 20px 30px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(1.7rem,6vw,2.5rem);letter-spacing:-.02em}
header p{margin:0 auto;max-width:34rem;color:#E6D3F7;font-size:1rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a:first-child{margin-left:auto}
nav a:last-child{margin-right:auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);
  padding:9px 15px;border-radius:999px;font-size:.92rem;font-weight:600;white-space:nowrap;min-height:40px;display:flex;align-items:center}
nav a:hover,nav a:focus-visible{background:var(--main);color:#fff;outline:none}
main{max-width:760px;margin:0 auto;padding:8px 16px 90px}
section{margin-top:30px}
section h2{margin:0;font-size:1.35rem;letter-spacing:-.01em}
section .sub{margin:2px 0 14px;color:var(--soft);font-size:.95rem}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--main);
  border-radius:12px;padding:16px;margin-bottom:12px}
.item.fin{opacity:.6;border-left-color:var(--soft)}
.item h3{margin:0 0 4px;font-size:1.08rem}
.item p{margin:6px 0 0;color:var(--soft);font-size:.95rem;white-space:pre-line}
.item .inst{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:.82rem;color:var(--soft)}
.badge{padding:2px 10px;border-radius:999px;background:var(--okbg);color:var(--ok);font-weight:700}
.badge.fin{background:var(--chip);color:var(--soft)}
.badge.pend{background:#FFF1CC;color:#7A5200}
@media (prefers-color-scheme: dark){ .badge.pend{background:#4A3600;color:#FFD66B} }
.btn{display:flex;align-items:center;justify-content:center;margin-top:14px;min-height:48px;
  background:var(--main);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:10px 18px}
.btn:hover,.btn:focus-visible{background:var(--main-2);outline:3px solid var(--chip)}
@media(min-width:600px){.btn{display:inline-flex}}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--soft)}
#up{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  width:50px;height:50px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:1.4rem;
  box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
footer{text-align:center;color:var(--soft);font-size:.85rem;padding:0 16px 40px}
</style>

    book:["M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z","M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"],

    mensaje:["M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"],

  };
  function icono(n){
    var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("class","ic");svg.setAttribute("aria-hidden","true");
    (ICONOS[n]||[]).forEach(function(d){var p=document.createElementNS(NS,"path");p.setAttribute("d",d);svg.appendChild(p);});
    return svg;
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"),function(x){x.appendChild(icono(x.getAttribute("data-icon")));});

        var acts=el("div","acts");
        if(ar&&!i.sinDescarga){var d=el("a","btn");d.appendChild(icono("download"));d.appendChild(document.createTextNode(i.boton&&!u?i.boton:"Descargar"));d.href=ar;d.setAttribute("download","");acts.appendChild(d);}
        if(u){var b=el("a","btn"+(ar&&!i.sinDescarga?" alt":""),"");b.appendChild(document.createTextNode(i.boton||(ar?"Ver en su publicación original":"Abrir enlace")));b.href=u;b.target="_blank";b.rel="noopener noreferrer nofollow";acts.appendChild(b);}
        c.appendChild(acts);
      }
      sec.appendChild(c);
    });
    cont.appendChild(sec);
  });
  var up=document.getElementById("up");
  up.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});
}

var HOJA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHnRlgWPFsaDnnJKTF3L0bjLDlrDiH6Gb20PTib5IKc8VUcDbCS0F67GzR9eCFmAGQTMK-iR5lBvyk/pub?gid=0&single=true&output=csv";

function leerCSV(t){
  var filas=[],fila=[],c="",q=false;
  for(var i=0;i<t.length;i++){
    var ch=t[i];
    if(q){
      if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; }
      else c+=ch;
    }else if(ch==='"'){ q=true; }
    else if(ch===","){ fila.push(c); c=""; }
    else if(ch==="\n"){ fila.push(c); filas.push(fila); fila=[]; c=""; }
    else if(ch!=="\r"){ c+=ch; }
  }
  if(c!==""||fila.length){ fila.push(c); filas.push(fila); }
  return filas;
}

function cargarHoja(){
  if(HOJA_URL.indexOf("https://docs.google.com/")!==0){ dibujar(); return; }
  fetch(HOJA_URL,{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("x"); return r.text(); })
    .then(function(t){
      var f=leerCSV(t);
      var cab=f.shift().map(function(x){return x.trim().toLowerCase();});
      var porId={};
      SECCIONES.forEach(function(s){ porId[s.id]=s; });
      f.forEach(function(r){
        var o={};
        cab.forEach(function(k,j){ o[k]=(r[j]||"").trim(); });
        var s=porId[o.seccion];
        if(s && o.nombre && (o.estado||"").toLowerCase()!=="oculto") s.items.unshift(o);
      });
      dibujar();
    })
    .catch(function(){ dibujar(); });
}
cargarHoja();
</script>
